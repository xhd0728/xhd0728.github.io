<link rel="apple-touch-icon" type="image/png" sizes="180x180" href="{{ '/images/apple-touch-icon.png' | relative_url }}?v={{ site.avatar_version }}">
<link rel="icon" type="image/webp" sizes="32x32" href="{{ '/images/favicon-32x32.webp' | relative_url }}?v={{ site.avatar_version }}">
<link rel="icon" type="image/webp" sizes="16x16" href="{{ '/images/favicon-16x16.webp' | relative_url }}?v={{ site.avatar_version }}">
<link rel="icon" type="image/x-icon" href="{{ '/images/favicon.ico' | relative_url }}?v={{ site.avatar_version }}" sizes="16x16 32x32 48x48">
<link rel="manifest" href="{{ '/images/site.webmanifest' | relative_url }}?v={{ site.avatar_version }}">

<meta name="application-name" content="{{ site.author.name | default: site.title }}">
<meta name="apple-mobile-web-app-title" content="{{ site.author.name | default: site.title }}">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="msapplication-TileColor" content="#ffffff">
<meta name="msapplication-TileImage" content="{{ '/images/android-chrome-192x192.webp' | relative_url }}?v={{ site.avatar_version }}">
<meta name="theme-color" content="#ffffff">

<script>
  (function () {
    function containsMathSyntax(text) {
      if (!text) return false;
      return /\\\(|\\\[|\\begin\{|\\frac|\\sum|\\int|\$\$[^$]+\$\$|\$[^$\n]+\$/.test(text);
    }

    function loadMathJax() {
      if (document.getElementById('MathJax-script')) return;
      window.MathJax = {
        tex: {
          inlineMath: [['$','$'], ['\\(','\\)']],
          processEscapes: true,
          tags: 'all'
        },
        options: {
          skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
        }
      };

      var script = document.createElement('script');
      script.id = 'MathJax-script';
      script.async = true;
      script.src = 'https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js';
      document.head.appendChild(script);
    }

    document.addEventListener('DOMContentLoaded', function () {
      var content = document.querySelector('.page__content');
      if (!content || !containsMathSyntax(content.textContent || '')) return;

      if ('requestIdleCallback' in window) {
        requestIdleCallback(loadMathJax, { timeout: 2000 });
      } else {
        window.setTimeout(loadMathJax, 400);
      }
    });
  })();
</script>

<!-- end custom head snippets -->
